[build-system]
requires = ["setuptools>=80.10.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxnn"
dynamic = ["version"]
description = "Foundation models in JAX/Flax"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shaymukhametov Rinat", email = "shaymukhametov.rinat.ml@gmail.com" }]
requires-python = ">=3.11"
keywords = ["jax", "flax", "deep-learning", "computer-vision", "resnet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "jax>=0.9.0",
    "flax>=0.12.3",
    "orbax-checkpoint>=0.11.32",
    "Pillow>=8,<12",
    "numpy>=1.26.0",
    "huggingface-hub>=1.4.1",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "einops>=0.8.2",
]

[project.optional-dependencies]

# CUDA 12.8 (Ampere / Ada / Hopper GPUs).
# Install with:
#   pip install "jaxnn[cu128]" \
#       --extra-index-url https://download.pytorch.org/whl/cu128
cu128 = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

# CUDA 12.6
# Install with:
#   pip install "jaxnn[cu126]" \
#       --extra-index-url https://download.pytorch.org/whl/cu126
cu126 = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

# Weight conversion from timm checkpoints (always CPU is fine).
# Install with:
#   pip install "jaxnn[convert]" \
#       --extra-index-url https://download.pytorch.org/whl/cpu
convert = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "timm>=1.0.25",
]

# Full dev environment (tests, linting, conversion tools).
dev = [
    "pytest>=8.0.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "timm>=1.0.25",
]

[project.urls]
Homepage = "https://github.com/Xrenya/jaxnn"
Repository = "https://github.com/Xrenya/jaxnn"
Issues = "https://github.com/Xrenya/jaxnn/issues"

[project.scripts]
jaxnn = "jaxnn.cli:main"

[tool.setuptools.dynamic]
version = { attr = "jaxnn.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["jaxnn*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
jaxnn = ["py.typed"]
