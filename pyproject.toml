[build-system]
requires = ["setuptools>=80.10.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxnn"
dynamic = ["version"]
description = "Foundation models in JAX/Flax"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shaymukhametov Rinat", email = "shaymukhametov.rinat.ml@gmail.com" }]
requires-python = ">=3.12"
keywords = ["jax", "flax", "deep-learning", "computer-vision", "resnet", "timm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "jax==0.9.0",
    "flax==0.12.3",
    "orbax-checkpoint==0.11.32",
    "Pillow>=12.1.1",
    "numpy>=2.3.5",
    "huggingface-hub>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "torch>=2.10.0",        # for weight conversion only
    "timm>=1.0.25",         # for weight conversion only
]

[project.urls]
Homepage = "https://github.com/Xrenya/jaxnn"
Repository = "https://github.com/Xrenya/jaxnn"
Issues = "https://github.com/Xrenya/jaxnn/issues"

[project.scripts]
jaxnn = "jaxnn.cli:main"

[tool.setuptools.dynamic]
version = { attr = "jaxnn.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["jaxnn*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
jaxnn = ["py.typed"]
